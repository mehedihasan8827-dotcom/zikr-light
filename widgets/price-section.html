<!-- ====== "আমের অফার মূল্য" সেকশন — HTML উইজেটে পেস্ট করুন ======

     পুরনো সেকশনের বদলে বসবে। আঁকাবাঁকা আন্ডারলাইন বাদ দিয়ে দুটি প্যাকেজ
     পাশাপাশি কার্ডে দেখানো হয়েছে, সাথে কেজিপ্রতি দাম — যাতে বড় প্যাকেজের
     সুবিধাটা কাস্টমারের চোখে পড়ে।

     ⚠️ "প্রায় ২৪-৩০টি আম" হিসাবটা আপনার নিজের তথ্য থেকে নেওয়া
        (৪-৫ টি আমে ১ কেজি)। আসল সংখ্যা ভিন্ন হলে বদলে দিন।
================================================================== -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

.zl-price {
  /* ---- থিম কালার ---- */
  --zl-deep-1: #0C5537;
  --zl-deep-2: #0A4A30;
  --zl-deep-3: #05291B;
  --zl-gold: #D9BE7A;
  --zl-gold-bright: #EBD49A;
  --zl-cream: #F5EFE0;
  --zl-paper: #F7F3EA;

  font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--zl-paper);
  padding: 56px 20px 64px;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.zl-price *,
.zl-price *::before,
.zl-price *::after { box-sizing: border-box; }

.zl-price__card {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 560px;
  border-radius: 24px;
  padding: 42px 40px 40px;
  background: linear-gradient(165deg, var(--zl-deep-1) 0%, var(--zl-deep-2) 45%, var(--zl-deep-3) 100%);
  border: 1px solid rgba(217, 190, 122, .3);
  box-shadow: 0 2px 4px rgba(5, 41, 27, .2),
              0 18px 40px -18px rgba(5, 41, 27, .55),
              inset 0 1px 0 rgba(235, 212, 154, .16);
}

.zl-price__card::before {
  content: "";
  position: absolute;
  top: -40%;
  left: 50%;
  transform: translateX(-50%);
  width: 120%;
  padding-bottom: 90%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(217, 190, 122, .13) 0%, rgba(217, 190, 122, 0) 65%);
  pointer-events: none;
}

.zl-price__card > * { position: relative; }

/* ---------- হেডিং ---------- */
.zl-price__title {
  margin: 0;
  color: var(--zl-cream);
  font-size: clamp(23px, 4vw, 30px);
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: -.01em;
  text-align: center;
}

.zl-price__orn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin: 16px 0 0;
}

.zl-price__orn i {
  display: block;
  width: 44px;
  height: 1px;
  background: linear-gradient(90deg, rgba(217, 190, 122, 0), var(--zl-gold));
}

.zl-price__orn i:last-child {
  background: linear-gradient(90deg, var(--zl-gold), rgba(217, 190, 122, 0));
}

.zl-price__orn span {
  width: 6px;
  height: 6px;
  transform: rotate(45deg);
  background: var(--zl-gold);
}

/* ---------- প্যাকেজ দুটি ---------- */
.zl-price__grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 32px 0 0;
}

.zl-pack {
  position: relative;
  text-align: center;
  padding: 26px 16px 22px;
  border-radius: 16px;
  background: rgba(255, 255, 255, .045);
  border: 1px solid rgba(217, 190, 122, .24);
}

/* জনপ্রিয় প্যাকেজটি সোনালি বর্ডারে আলাদা */
.zl-pack--popular {
  background: rgba(217, 190, 122, .11);
  border: 1.5px solid var(--zl-gold);
  box-shadow: 0 10px 26px -16px rgba(5, 41, 27, .7);
}

.zl-pack__badge {
  position: absolute;
  top: -11px;
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 14px 3px;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--zl-gold-bright), var(--zl-gold));
  color: var(--zl-deep-3);
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
}

.zl-pack__weight {
  margin: 0;
  font-size: 15.5px;
  font-weight: 600;
  color: rgba(245, 239, 224, .78);
}

.zl-pack__price {
  margin: 6px 0 0;
  font-size: clamp(27px, 5vw, 33px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -.02em;
  color: var(--zl-gold-bright);
}

.zl-pack__price span {
  font-size: .55em;
  font-weight: 600;
  color: var(--zl-gold);
}

.zl-pack__rate {
  margin: 12px 0 0;
  padding-top: 11px;
  border-top: 1px solid rgba(217, 190, 122, .2);
  font-size: 14px;
  line-height: 1.7;
  color: rgba(245, 239, 224, .72);
}

.zl-pack__save {
  display: inline-block;
  margin: 11px 0 0;
  padding: 3px 12px 2px;
  border-radius: 999px;
  background: var(--zl-gold);
  color: var(--zl-deep-3);
  font-size: 13px;
  font-weight: 700;
}

/* ---------- ফ্রি ডেলিভারি লাইন ---------- */
.zl-price__delivery {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin: 26px 0 0;
  padding: 15px 18px;
  border: 1px dashed rgba(217, 190, 122, .45);
  border-radius: 13px;
  color: var(--zl-gold-bright);
  font-size: clamp(14.5px, 2.4vw, 16px);
  font-weight: 600;
  text-align: center;
}

.zl-price__delivery svg { flex: none; }

/* ---------- মোবাইল ---------- */
@media (max-width: 520px) {
  .zl-price { padding: 40px 16px 48px; }
  .zl-price__card { padding: 34px 20px 30px; border-radius: 20px; }
  .zl-price__grid {
    grid-template-columns: 1fr;
    gap: 22px;
    margin-top: 34px;
  }
  .zl-pack { padding: 24px 16px 20px; }
}
</style>

<section class="zl-price" aria-labelledby="zl-price-title">
  <div class="zl-price__card">

    <h2 class="zl-price__title" id="zl-price-title">আমের অফার মূল্য</h2>
    <div class="zl-price__orn" aria-hidden="true"><i></i><span></span><i></i></div>

    <div class="zl-price__grid">

      <!-- ৬ কেজি প্যাকেজ -->
      <div class="zl-pack">
        <p class="zl-pack__weight">৬ কেজি</p>
        <p class="zl-pack__price">১,২৯০ <span>টাকা</span></p>
        <p class="zl-pack__rate">
          কেজিপ্রতি ২১৫ টাকা<br>
          প্রায় ২৪-৩০টি আম
        </p>
      </div>

      <!-- ১০ কেজি প্যাকেজ -->
      <div class="zl-pack zl-pack--popular">
        <span class="zl-pack__badge">সবচেয়ে জনপ্রিয়</span>
        <p class="zl-pack__weight">১০ কেজি</p>
        <p class="zl-pack__price">২,১০০ <span>টাকা</span></p>
        <p class="zl-pack__rate">
          কেজিপ্রতি ২১০ টাকা<br>
          প্রায় ৪০-৫০টি আম
        </p>
        <span class="zl-pack__save">৫০ টাকা সাশ্রয়</span>
      </div>

    </div>

    <p class="zl-price__delivery">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 3h15v13H1z"/>
        <path d="M16 8h4l3 3v5h-7z"/>
        <circle cx="5.5" cy="18.5" r="2.5"/>
        <circle cx="18.5" cy="18.5" r="2.5"/>
      </svg>
      সারা দেশে হোম ডেলিভারি সম্পূর্ণ ফ্রি
    </p>

  </div>
</section>
