<!-- ====== "আমের অফার মূল্য" সেকশন — HTML উইজেটে পেস্ট করুন ======

     ⚠️ "প্রায় ২৪-৩০টি আম" হিসাবটা আপনার নিজের তথ্য থেকে নেওয়া
        (৪-৫ টি আমে ১ কেজি)। আসল সংখ্যা ভিন্ন হলে বদলে দিন।
================================================================== -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600&display=swap');

.zl-price {
  /* ---- থিম কালার ---- */
  --zl-green: #0A4A2C;
  --zl-ink: #17402C;
  --zl-muted: #6B7C6F;
  --zl-gold: #A8813C;
  --zl-rule: #E3DED0;
  --zl-paper: #FBF9F3;

  font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
  background: var(--zl-paper);
  color: var(--zl-ink);
  padding: 84px 20px 88px;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.zl-price *,
.zl-price *::before,
.zl-price *::after { box-sizing: border-box; }

.zl-price__inner {
  width: 100%;
  max-width: 620px;
  background: #FFFFFF;
  border: 1px solid var(--zl-rule);
  border-radius: 6px;
  padding: 54px 56px 46px;
}

/* ---------- উপরের ছোট লেবেল ---------- */
.zl-price__label {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 16px;
  color: var(--zl-gold);
  font-size: 13.5px;
  font-weight: 600;
}

.zl-price__label::before {
  content: "";
  width: 26px;
  height: 1px;
  background: var(--zl-gold);
}

/* ---------- হেডিং — উচ্চ-কনট্রাস্ট সেরিফ ---------- */
.zl-price__title {
  margin: 0;
  font-family: 'Tiro Bangla', 'Noto Serif Bengali', Georgia, serif;
  font-weight: 400;
  color: var(--zl-green);
  font-size: clamp(30px, 6.2vw, 46px);
  line-height: 1.32;
  letter-spacing: -.005em;
}

.zl-price__rule {
  margin: 34px 0 0;
  border: 0;
  border-top: 1px solid var(--zl-rule);
}

/* ---------- প্যাকেজ — কার্ড নয়, সারি ----------
   গ্রিড ব্যবহার করা হয়েছে যাতে লেবেলটি আলাদা সারিতে বসে এবং
   ওজন ও দাম সবসময় একই লাইনে থাকে। */
.zl-pack {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: baseline;
  gap: 0 24px;
  padding: 28px 0;
  border-bottom: 1px solid var(--zl-rule);
}

.zl-pack__left { min-width: 0; }

.zl-pack__tag {
  grid-column: 1 / -1;
  margin: 0 0 8px;
  color: var(--zl-gold);
  font-size: 12.5px;
  font-weight: 600;
}

.zl-pack__weight {
  margin: 0;
  font-family: 'Tiro Bangla', 'Noto Serif Bengali', Georgia, serif;
  color: var(--zl-green);
  font-size: clamp(21px, 3.6vw, 25px);
  line-height: 1.35;
}

.zl-pack__count {
  margin: 4px 0 0;
  color: var(--zl-muted);
  font-size: 14.5px;
  font-weight: 500;
}

.zl-pack__right {
  flex: none;
  text-align: right;
}

/* দামটিই সেকশনের নায়ক */
.zl-pack__price {
  margin: 0;
  font-family: 'Tiro Bangla', 'Noto Serif Bengali', Georgia, serif;
  color: var(--zl-green);
  font-size: clamp(30px, 5.6vw, 40px);
  line-height: 1.1;
  letter-spacing: -.01em;
  white-space: nowrap;
}

.zl-pack__price span {
  font-family: 'Hind Siliguri', sans-serif;
  font-size: .38em;
  font-weight: 500;
  color: var(--zl-muted);
}

.zl-pack__rate {
  margin: 6px 0 0;
  color: var(--zl-muted);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
}

/* ---------- ফ্রি ডেলিভারি ---------- */
.zl-price__delivery {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 26px 0 0;
  color: var(--zl-green);
  font-size: clamp(15px, 2.4vw, 16.5px);
  font-weight: 600;
}

.zl-price__delivery svg {
  flex: none;
  color: var(--zl-gold);
}

/* ---------- মোবাইল ---------- */
@media (max-width: 560px) {
  .zl-price { padding: 56px 16px 60px; }
  .zl-price__inner { padding: 36px 24px 32px; }
  .zl-price__rule { margin-top: 26px; }
  .zl-pack {
    grid-template-columns: 1fr;
    padding: 22px 0;
  }
  .zl-pack__right {
    text-align: left;
    margin-top: 10px;
  }
}
</style>

<section class="zl-price" aria-labelledby="zl-price-title">
  <div class="zl-price__inner">

    <p class="zl-price__label">মূল্য</p>
    <h2 class="zl-price__title" id="zl-price-title">আমের অফার মূল্য</h2>
    <hr class="zl-price__rule">

    <!-- ৬ কেজি -->
    <div class="zl-pack">
      <div class="zl-pack__left">
        <p class="zl-pack__weight">৬ কেজি</p>
        <p class="zl-pack__count">প্রায় ২৪-৩০টি আম</p>
      </div>
      <div class="zl-pack__right">
        <p class="zl-pack__price">১,২৯০ <span>টাকা</span></p>
        <p class="zl-pack__rate">কেজিপ্রতি ২১৫ টাকা</p>
      </div>
    </div>

    <!-- ১০ কেজি -->
    <div class="zl-pack">
      <div class="zl-pack__left">
        <p class="zl-pack__tag">সবচেয়ে জনপ্রিয়</p>
        <p class="zl-pack__weight">১০ কেজি</p>
        <p class="zl-pack__count">প্রায় ৪০-৫০টি আম</p>
      </div>
      <div class="zl-pack__right">
        <p class="zl-pack__price">২,১০০ <span>টাকা</span></p>
        <p class="zl-pack__rate">কেজিপ্রতি ২১০ টাকা — ৫০ টাকা সাশ্রয়</p>
      </div>
    </div>

    <p class="zl-price__delivery">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 3h15v13H1z"/>
        <path d="M16 8h4l3 3v5h-7z"/>
        <circle cx="5.5" cy="18.5" r="2.5"/>
        <circle cx="18.5" cy="18.5" r="2.5"/>
      </svg>
      সারা দেশে হোম ডেলিভারি সম্পূর্ণ ফ্রি
    </p>

  </div>
</section>
