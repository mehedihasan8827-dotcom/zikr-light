<!-- ====== "আমের অফার মূল্য" সেকশন — HTML উইজেটে পেস্ট করুন ======

     পুরনো সেকশনের বদলে বসবে। আঁকাবাঁকা আন্ডারলাইন বাদ দিয়ে দুটি প্যাকেজ
     পাশাপাশি কার্ডে দেখানো হয়েছে, সাথে কেজিপ্রতি দাম — যাতে বড় প্যাকেজের
     সুবিধাটা কাস্টমারের চোখে পড়ে।

     ⚠️ "প্রায় ২৪-৩০টি আম" হিসাবটা আপনার নিজের তথ্য থেকে নেওয়া
        (৪-৫ টি আমে ১ কেজি)। আসল সংখ্যা ভিন্ন হলে বদলে দিন।
================================================================== -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

.zl-price {
  /* ---- থিম কালার ---- */
  --zl-green-900: #063D22;
  --zl-green-800: #0A5230;
  --zl-green-700: #0B6B3A;
  --zl-ink: #0D482B;
  --zl-muted: #5C7568;
  --zl-line: #CBE0D3;
  --zl-line-soft: #DCEAE1;
  --zl-mint: #F1F8F3;
  --zl-paper: #FBFDFB;

  font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--zl-paper);
  color: var(--zl-ink);
  padding: 56px 20px 64px;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.zl-price *,
.zl-price *::before,
.zl-price *::after { box-sizing: border-box; }

.zl-price__card {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 560px;
  background: #FFFFFF;
  border: 1.5px solid var(--zl-line);
  border-radius: 20px;
  padding: 44px 40px 40px;
  box-shadow: 0 1px 2px rgba(6, 61, 34, .05),
              0 6px 14px -8px rgba(6, 61, 34, .16),
              0 22px 44px -26px rgba(6, 61, 34, .3);
}

.zl-price__card::before {
  content: "";
  position: absolute;
  top: -50%;
  left: 50%;
  transform: translateX(-50%);
  width: 125%;
  padding-bottom: 100%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(11, 107, 58, .05) 0%, rgba(11, 107, 58, 0) 62%);
  pointer-events: none;
}

.zl-price__card > * { position: relative; }

/* ---------- হেডিং ---------- */
.zl-price__title {
  margin: 0;
  color: var(--zl-green-900);
  font-size: clamp(25px, 4.3vw, 32px);
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: -.02em;
  text-align: center;
}

.zl-price__accent {
  width: 56px;
  height: 4px;
  margin: 16px auto 0;
  border-radius: 999px;
  background: var(--zl-green-700);
}

/* ---------- প্যাকেজ দুটি ---------- */
.zl-price__grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 32px 0 0;
}

.zl-pack {
  position: relative;
  text-align: center;
  padding: 26px 16px 22px;
  border: 1.5px solid var(--zl-line);
  border-radius: 16px;
  background: #FFFFFF;
}

/* জনপ্রিয় প্যাকেজটি মোটা সবুজ বর্ডারে আলাদা */
.zl-pack--popular {
  border: 2.5px solid var(--zl-green-800);
  background: var(--zl-mint);
  box-shadow: 0 10px 26px -18px rgba(6, 61, 34, .5);
}

.zl-pack__badge {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 14px 3px;
  border-radius: 999px;
  background: var(--zl-green-800);
  color: #FFFFFF;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.zl-pack__weight {
  margin: 0;
  color: var(--zl-muted);
  font-size: 16px;
  font-weight: 600;
}

.zl-pack__price {
  margin: 6px 0 0;
  color: var(--zl-green-900);
  font-size: clamp(29px, 5.4vw, 36px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -.03em;
}

.zl-pack__price span {
  font-size: .5em;
  font-weight: 600;
  color: var(--zl-muted);
  letter-spacing: 0;
}

.zl-pack__rate {
  margin: 13px 0 0;
  padding-top: 12px;
  border-top: 1px solid var(--zl-line-soft);
  color: var(--zl-ink);
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.7;
}

.zl-pack__save {
  display: inline-block;
  margin: 12px 0 0;
  padding: 4px 13px 3px;
  border-radius: 999px;
  background: var(--zl-green-800);
  color: #FFFFFF;
  font-size: 13px;
  font-weight: 700;
}

/* ---------- ফ্রি ডেলিভারি লাইন ---------- */
.zl-price__delivery {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 26px 0 0;
  padding: 16px 18px;
  border-radius: 13px;
  background: var(--zl-green-800);
  color: #FFFFFF;
  font-size: clamp(15px, 2.5vw, 16.5px);
  font-weight: 700;
  text-align: center;
}

.zl-price__delivery svg { flex: none; }

/* ---------- মোবাইল ---------- */
@media (max-width: 520px) {
  .zl-price { padding: 40px 16px 48px; }
  .zl-price__card { padding: 34px 20px 30px; border-radius: 18px; }
  .zl-price__grid {
    grid-template-columns: 1fr;
    gap: 24px;
    margin-top: 36px;
  }
  .zl-pack { padding: 24px 16px 20px; }
}
</style>

<section class="zl-price" aria-labelledby="zl-price-title">
  <div class="zl-price__card">

    <h2 class="zl-price__title" id="zl-price-title">আমের অফার মূল্য</h2>
    <div class="zl-price__accent" aria-hidden="true"></div>

    <div class="zl-price__grid">

      <!-- ৬ কেজি প্যাকেজ -->
      <div class="zl-pack">
        <p class="zl-pack__weight">৬ কেজি</p>
        <p class="zl-pack__price">১,২৯০ <span>টাকা</span></p>
        <p class="zl-pack__rate">
          কেজিপ্রতি ২১৫ টাকা<br>
          প্রায় ২৪-৩০টি আম
        </p>
      </div>

      <!-- ১০ কেজি প্যাকেজ -->
      <div class="zl-pack zl-pack--popular">
        <span class="zl-pack__badge">সবচেয়ে জনপ্রিয়</span>
        <p class="zl-pack__weight">১০ কেজি</p>
        <p class="zl-pack__price">২,১০০ <span>টাকা</span></p>
        <p class="zl-pack__rate">
          কেজিপ্রতি ২১০ টাকা<br>
          প্রায় ৪০-৫০টি আম
        </p>
        <span class="zl-pack__save">৫০ টাকা সাশ্রয়</span>
      </div>

    </div>

    <p class="zl-price__delivery">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 3h15v13H1z"/>
        <path d="M16 8h4l3 3v5h-7z"/>
        <circle cx="5.5" cy="18.5" r="2.5"/>
        <circle cx="18.5" cy="18.5" r="2.5"/>
      </svg>
      সারা দেশে হোম ডেলিভারি সম্পূর্ণ ফ্রি
    </p>

  </div>
</section>
