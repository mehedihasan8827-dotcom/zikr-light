<!-- ====== আমের বৈশিষ্ট্য সেকশন — কপি করে HTML উইজেটে পেস্ট করুন ======
     পয়েন্ট বাড়াতে/কমাতে গোটা <li> ব্লকটি কপি করে বসান বা মুছে দিন
     (নাম্বারটাও হাতে বদলে দিতে হবে)।
     রঙ বদলাতে .zl-features এর ভেতরের --zl-* ভ্যারিয়েবলগুলো এডিট করুন।
========================================================================= -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600&display=swap');

.zl-features {
  /* ---- থিম কালার ---- */
  --zl-green: #0A4A2C;      /* হেডিং ও প্রধান সবুজ */
  --zl-ink: #17402C;        /* বডি টেক্সট */
  --zl-muted: #6B7C6F;
  --zl-gold: #A8813C;       /* পাকা আমের খোসার সোনালি */
  --zl-rule: #E3DED0;       /* উষ্ণ হেয়ারলাইন */
  --zl-paper: #FBF9F3;      /* উষ্ণ প্রায়-সাদা */

  /* বডি ফন্ট */
  font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
  background: var(--zl-paper);
  color: var(--zl-ink);
  padding: 84px 20px 88px;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.zl-features *,
.zl-features *::before,
.zl-features *::after { box-sizing: border-box; }

.zl-features__inner {
  width: 100%;
  max-width: 620px;
  background: #FFFFFF;
  border: 1px solid var(--zl-rule);
  border-radius: 6px;          /* তীক্ষ্ণ কোণ — গোল কোণের চেয়ে বেশি সংযত */
  padding: 54px 56px 46px;
}

/* ---------- উপরের ছোট লেবেল ----------
   বাংলা যুক্তাক্ষর ভেঙে যায়, তাই এখানে letter-spacing দেওয়া হয়নি।
   লেবেলটি আলাদা বোঝাতে পাশে একটি ছোট সোনালি রেখা ব্যবহার করা হয়েছে। */
.zl-features__label {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 16px;
  color: var(--zl-gold);
  font-size: 13.5px;
  font-weight: 600;
}

.zl-features__label::before {
  content: "";
  width: 26px;
  height: 1px;
  background: var(--zl-gold);
}

/* ---------- হেডিং — উচ্চ-কনট্রাস্ট সেরিফ ---------- */
.zl-features__title {
  margin: 0;
  font-family: 'Tiro Bangla', 'Noto Serif Bengali', Georgia, serif;
  font-weight: 400;            /* সেরিফটির নিজস্ব ওজনই যথেষ্ট */
  color: var(--zl-green);
  font-size: clamp(30px, 6.2vw, 46px);
  line-height: 1.32;
  letter-spacing: -.005em;
}

.zl-features__rule {
  margin: 34px 0 0;
  border: 0;
  border-top: 1px solid var(--zl-rule);
}

/* ---------- বৈশিষ্ট্যের তালিকা ---------- */
.zl-features__list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.zl-features__list li {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 0 18px;
  padding: 24px 0;
  border-bottom: 1px solid var(--zl-rule);
  font-size: clamp(16px, 2.5vw, 17.5px);
  font-weight: 500;
  line-height: 1.85;
}

.zl-features__list li:last-child { border-bottom: 0; padding-bottom: 6px; }

/* সেরিফ নাম্বার — সোনালি */
.zl-features__no {
  font-family: 'Tiro Bangla', 'Noto Serif Bengali', Georgia, serif;
  color: var(--zl-gold);
  font-size: 17px;
  line-height: 1.85;
  letter-spacing: .04em;
}

/* ---------- মোবাইল ---------- */
@media (max-width: 560px) {
  .zl-features { padding: 56px 16px 60px; }
  .zl-features__inner { padding: 36px 24px 30px; }
  .zl-features__rule { margin-top: 26px; }
  .zl-features__list li {
    grid-template-columns: 26px 1fr;
    gap: 0 13px;
    padding: 20px 0;
  }
  .zl-features__no { font-size: 15.5px; }
}
</style>

<section class="zl-features" aria-labelledby="zl-features-title">
  <div class="zl-features__inner">

    <p class="zl-features__label">বৈশিষ্ট্য</p>
    <h2 class="zl-features__title" id="zl-features-title">সুইট কাটিমন আমের বৈশিষ্ট্য</h2>
    <hr class="zl-features__rule">

    <ul class="zl-features__list">
      <li>
        <span class="zl-features__no" aria-hidden="true">০১</span>
        <span>কড়া-মিষ্টি, একদম টকভাব নেই।</span>
      </li>
      <li>
        <span class="zl-features__no" aria-hidden="true">০২</span>
        <span>আঠাবিহীন, শিশুদের প্রিয়।</span>
      </li>
      <li>
        <span class="zl-features__no" aria-hidden="true">০৩</span>
        <span>বড় সাইজের — এভারেজ ৪-৫ টি আমে ১ কেজি ওজন হয়।</span>
      </li>
      <li>
        <span class="zl-features__no" aria-hidden="true">০৪</span>
        <span>আঁটি পাতলা, মাংসল অংশের পরিমাণ অনেক বেশি।</span>
      </li>
    </ul>

  </div>
</section>
