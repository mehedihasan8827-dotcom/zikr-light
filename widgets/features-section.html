<!-- ====== আমের বৈশিষ্ট্য সেকশন — কপি করে HTML উইজেটে পেস্ট করুন ======
     পয়েন্ট বাড়াতে/কমাতে নিচের <li> ব্লকটি কপি করে বসান বা মুছে দিন।
     রঙ বদলাতে .zl-features এর ভেতরের --zl-* ভ্যারিয়েবলগুলো এডিট করুন।
========================================================================= -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

.zl-features {
  /* ---- থিম কালার ---- */
  --zl-deep-1: #0C5537;
  --zl-deep-2: #0A4A30;
  --zl-deep-3: #05291B;
  --zl-gold: #D9BE7A;
  --zl-gold-bright: #EBD49A;
  --zl-cream: #F5EFE0;
  --zl-paper: #F7F3EA;

  font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--zl-paper);
  padding: 56px 20px 64px;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.zl-features *,
.zl-features *::before,
.zl-features *::after { box-sizing: border-box; }

.zl-features__card {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 560px;
  border-radius: 24px;
  padding: 42px 44px 34px;
  background: linear-gradient(165deg, var(--zl-deep-1) 0%, var(--zl-deep-2) 45%, var(--zl-deep-3) 100%);
  border: 1px solid rgba(217, 190, 122, .3);
  box-shadow: 0 2px 4px rgba(5, 41, 27, .2),
              0 18px 40px -18px rgba(5, 41, 27, .55),
              inset 0 1px 0 rgba(235, 212, 154, .16);
}

.zl-features__card::before {
  content: "";
  position: absolute;
  top: -40%;
  left: 50%;
  transform: translateX(-50%);
  width: 120%;
  padding-bottom: 90%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(217, 190, 122, .13) 0%, rgba(217, 190, 122, 0) 65%);
  pointer-events: none;
}

.zl-features__card > * { position: relative; }

/* ---------- হেডিং ---------- */
.zl-features__title {
  margin: 0;
  color: var(--zl-cream);
  font-size: clamp(23px, 4vw, 30px);
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: -.01em;
  text-align: center;
}

.zl-features__orn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin: 16px 0 0;
}

.zl-features__orn i {
  display: block;
  width: 44px;
  height: 1px;
  background: linear-gradient(90deg, rgba(217, 190, 122, 0), var(--zl-gold));
}

.zl-features__orn i:last-child {
  background: linear-gradient(90deg, var(--zl-gold), rgba(217, 190, 122, 0));
}

.zl-features__orn span {
  width: 6px;
  height: 6px;
  transform: rotate(45deg);
  background: var(--zl-gold);
}

/* ---------- বৈশিষ্ট্যের লিস্ট ---------- */
.zl-features__list {
  margin: 28px 0 0;
  padding: 0;
  list-style: none;
}

.zl-features__list li {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 0;
  color: rgba(245, 239, 224, .92);
  font-size: clamp(15.5px, 2.5vw, 17px);
  line-height: 1.75;
}

.zl-features__list li + li {
  border-top: 1px solid rgba(217, 190, 122, .18);
}

/* সোনালি চেক আইকন */
.zl-features__check {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  margin-top: 2px;
  border: 1px solid rgba(217, 190, 122, .45);
  border-radius: 50%;
  background: rgba(217, 190, 122, .12);
  color: var(--zl-gold-bright);
}

/* ---------- মোবাইল ---------- */
@media (max-width: 520px) {
  .zl-features { padding: 40px 16px 48px; }
  .zl-features__card { padding: 34px 20px 26px; border-radius: 20px; }
  .zl-features__list { margin-top: 22px; }
  .zl-features__list li { gap: 12px; padding: 14px 0; }
  .zl-features__check { width: 24px; height: 24px; }
}
</style>

<section class="zl-features" aria-labelledby="zl-features-title">
  <div class="zl-features__card">

    <h2 class="zl-features__title" id="zl-features-title">সুইট কাটিমন আমের বৈশিষ্ট্য</h2>
    <div class="zl-features__orn" aria-hidden="true"><i></i><span></span><i></i></div>

    <ul class="zl-features__list">

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        কড়া-মিষ্টি, একদম টকভাব নেই।
      </li>

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        আঠাবিহীন, শিশুদের প্রিয়।
      </li>

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        বড় সাইজের — এভারেজ ৪-৫ টি আমে ১ কেজি ওজন হয়।
      </li>

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        আঁটি পাতলা, মাংসল অংশের পরিমাণ অনেক বেশি।
      </li>

    </ul>

  </div>
</section>
