<!-- ====== আমের বৈশিষ্ট্য সেকশন — কপি করে HTML উইজেটে পেস্ট করুন ======
     পয়েন্ট বাড়াতে/কমাতে নিচের <li> ব্লকটি কপি করে বসান বা মুছে দিন।
     রঙ বদলাতে .zl-features এর ভেতরের --zl-* ভ্যারিয়েবলগুলো এডিট করুন।
========================================================================= -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

.zl-features {
  /* ---- থিম কালার ---- */
  --zl-green-900: #063D22;
  --zl-green-800: #0A5230;
  --zl-green-700: #0B6B3A;
  --zl-ink: #0D482B;
  --zl-line: #CBE0D3;
  --zl-line-soft: #DCEAE1;
  --zl-mint: #F1F8F3;
  --zl-paper: #FBFDFB;

  font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--zl-paper);
  color: var(--zl-ink);
  padding: 56px 20px 64px;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.zl-features *,
.zl-features *::before,
.zl-features *::after { box-sizing: border-box; }

.zl-features__card {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 560px;
  background: #FFFFFF;
  border: 1.5px solid var(--zl-line);
  border-radius: 20px;
  padding: 44px 44px 34px;
  box-shadow: 0 1px 2px rgba(6, 61, 34, .05),
              0 6px 14px -8px rgba(6, 61, 34, .16),
              0 22px 44px -26px rgba(6, 61, 34, .3);
}

.zl-features__card::before {
  content: "";
  position: absolute;
  top: -50%;
  left: 50%;
  transform: translateX(-50%);
  width: 125%;
  padding-bottom: 100%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(11, 107, 58, .05) 0%, rgba(11, 107, 58, 0) 62%);
  pointer-events: none;
}

.zl-features__card > * { position: relative; }

/* ---------- হেডিং ---------- */
.zl-features__title {
  margin: 0;
  color: var(--zl-green-900);
  font-size: clamp(25px, 4.3vw, 32px);
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: -.02em;
  text-align: center;
}

.zl-features__accent {
  width: 56px;
  height: 4px;
  margin: 16px auto 0;
  border-radius: 999px;
  background: var(--zl-green-700);
}

/* ---------- বৈশিষ্ট্যের লিস্ট ---------- */
.zl-features__list {
  margin: 30px 0 0;
  padding: 0;
  list-style: none;
}

.zl-features__list li {
  display: flex;
  align-items: flex-start;
  gap: 15px;
  padding: 17px 0;
  color: var(--zl-ink);
  font-size: clamp(16px, 2.6vw, 17.5px);
  font-weight: 600;
  line-height: 1.72;
}

.zl-features__list li + li {
  border-top: 1px solid var(--zl-line-soft);
}

/* ভরাট সবুজ চেক আইকন */
.zl-features__check {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  margin-top: 3px;
  border-radius: 50%;
  background: var(--zl-green-800);
  color: #FFFFFF;
}

/* ---------- মোবাইল ---------- */
@media (max-width: 520px) {
  .zl-features { padding: 40px 16px 48px; }
  .zl-features__card { padding: 34px 20px 26px; border-radius: 18px; }
  .zl-features__list { margin-top: 24px; }
  .zl-features__list li { gap: 13px; padding: 15px 0; }
  .zl-features__check { width: 24px; height: 24px; }
}
</style>

<section class="zl-features" aria-labelledby="zl-features-title">
  <div class="zl-features__card">

    <h2 class="zl-features__title" id="zl-features-title">সুইট কাটিমন আমের বৈশিষ্ট্য</h2>
    <div class="zl-features__accent" aria-hidden="true"></div>

    <ul class="zl-features__list">

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        কড়া-মিষ্টি, একদম টকভাব নেই।
      </li>

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        আঠাবিহীন, শিশুদের প্রিয়।
      </li>

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        বড় সাইজের — এভারেজ ৪-৫ টি আমে ১ কেজি ওজন হয়।
      </li>

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        আঁটি পাতলা, মাংসল অংশের পরিমাণ অনেক বেশি।
      </li>

    </ul>

  </div>
</section>
