<!-- ====== আমের বৈশিষ্ট্য সেকশন — কপি করে HTML উইজেটে পেস্ট করুন ======
     পয়েন্ট বাড়াতে/কমাতে নিচের <li> ব্লকটি কপি করে বসান বা মুছে দিন।
     রঙ বদলাতে .zl-features এর ভেতরের --zl-* ভ্যারিয়েবলগুলো এডিট করুন।
========================================================================= -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

.zl-features {
  /* ---- থিম কালার: এখান থেকে পুরো সেকশনের রঙ বদলানো যাবে ---- */
  --zl-green: #0B6B3A;
  --zl-mint: #F3F8F4;
  --zl-line: #E4EEE8;
  --zl-ink: #12251B;

  font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(11, 107, 58, .07) 0%, rgba(11, 107, 58, 0) 60%),
    #FFFFFF;
  color: var(--zl-ink);
  padding: 56px 20px 64px;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.zl-features *,
.zl-features *::before,
.zl-features *::after { box-sizing: border-box; }

.zl-features__card {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 560px;
  background: #FFFFFF;
  border: 1px solid var(--zl-line);
  border-radius: 26px;
  padding: 42px 44px 26px;
  box-shadow: 0 1px 1px rgba(4, 50, 33, .03),
              0 4px 10px -6px rgba(4, 50, 33, .08),
              0 24px 56px -28px rgba(4, 50, 33, .26);
}

/* কার্ডের ভেতরে উপরের দিকে হালকা সবুজ আভা */
.zl-features__card::before {
  content: "";
  position: absolute;
  top: -55%;
  left: 50%;
  transform: translateX(-50%);
  width: 130%;
  padding-bottom: 110%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(11, 107, 58, .06) 0%, rgba(11, 107, 58, 0) 62%);
  pointer-events: none;
}

.zl-features__card > * { position: relative; }

/* ---------- হেডিং ---------- */
.zl-features__title {
  margin: 0;
  font-size: clamp(22px, 3.8vw, 28px);
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: -.01em;
  text-align: center;
}

/* হেডিংয়ের নিচের ছোট সবুজ রেখা */
.zl-features__accent {
  width: 48px;
  height: 3px;
  margin: 14px auto 0;
  border-radius: 999px;
  background: var(--zl-green);
}

/* ---------- বৈশিষ্ট্যের লিস্ট ---------- */
.zl-features__list {
  margin: 26px 0 0;
  padding: 0;
  list-style: none;
}

.zl-features__list li {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 0;
  font-size: clamp(15.5px, 2.5vw, 17px);
  line-height: 1.75;
}

/* পয়েন্টগুলোর মাঝে সূক্ষ্ম রেখা — প্রথমটির উপরে পড়বে না */
.zl-features__list li + li {
  border-top: 1px solid var(--zl-line);
}

/* চেক আইকনের গোল ব্যাকগ্রাউন্ড */
.zl-features__check {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  margin-top: 2px;
  border: 1px solid var(--zl-line);
  border-radius: 50%;
  background: var(--zl-mint);
  color: var(--zl-green);
}

/* ---------- মোবাইল ---------- */
@media (max-width: 520px) {
  .zl-features { padding: 40px 16px 48px; }
  .zl-features__card { padding: 32px 22px 26px; border-radius: 22px; }
  .zl-features__list { margin-top: 20px; }
  .zl-features__list li { gap: 12px; padding: 14px 0; }
  .zl-features__check { width: 24px; height: 24px; }
}
</style>

<section class="zl-features" aria-labelledby="zl-features-title">
  <div class="zl-features__card">

    <h2 class="zl-features__title" id="zl-features-title">সুইট কাটিমন আমের বৈশিষ্ট্য</h2>
    <div class="zl-features__accent" aria-hidden="true"></div>

    <ul class="zl-features__list">

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        কড়া-মিষ্টি, একদম টকভাব নেই।
      </li>

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        আঠাবিহীন, শিশুদের প্রিয়।
      </li>

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        বড় সাইজের — এভারেজ ৪-৫ টি আমে ১ কেজি ওজন হয়।
      </li>

      <li>
        <span class="zl-features__check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        আঁটি পাতলা, মাংসল অংশের পরিমাণ অনেক বেশি।
      </li>

    </ul>

  </div>
</section>
