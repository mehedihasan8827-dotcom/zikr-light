<!-- ===== Himsagor Hero — Elementor HTML widget ready ===== -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">

<section class="pfm-himsagor-hero">
  <style>
    .pfm-himsagor-hero * { box-sizing: border-box; margin: 0; padding: 0; }
    .pfm-himsagor-hero {
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'SolaimanLipi', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 100% 0%, rgba(31,122,58,.06), transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(255,193,7,.10), transparent 50%),
        #FFFFFF;
      color: #1A1A1A;
      padding: 0 0 28px;
      position: relative;
      overflow: hidden;
    }
    .pfm-h-strip {
      background: linear-gradient(180deg, #1F7A3A 0%, #1B6A33 100%);
      color: #FFFFFF; text-align: center;
      padding: 12px 20px; font-size: 13.5px; font-weight: 600;
      letter-spacing: .2px; line-height: 1.5;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; flex-wrap: wrap;
      text-shadow: 0 1px 0 rgba(0,0,0,.12);
    }
    .pfm-h-strip .txt { display: inline-flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; justify-content: center; }
    .pfm-h-strip .sep { opacity: .45; margin: 0 2px; }
    .pfm-h-strip b { font-weight: 700; color: #FFE680; }
    .pfm-h-strip .pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: #FFC107; display: inline-block;
      box-shadow: 0 0 0 0 rgba(255,193,7,.7);
      animation: pfmPulse 1.6s infinite;
    }
    @keyframes pfmPulse {
      0% { box-shadow: 0 0 0 0 rgba(255,193,7,.7); }
      70% { box-shadow: 0 0 0 8px rgba(255,193,7,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,193,7,0); }
    }
    .pfm-h-wrap { max-width: 680px; margin: 0 auto; padding: 48px 20px 0; text-align: center; position: relative; }
    .pfm-h-title { font-size: clamp(24px, 6.4vw, 40px); line-height: 1.4; font-weight: 700; color: #0F2A1A; margin-bottom: 16px; letter-spacing: -.2px; }
    .pfm-h-title .line { display: block; }
    .pfm-h-title .green { color: #1F7A3A; }
    .pfm-h-title .hl { background: linear-gradient(180deg, transparent 55%, #FFE680 55%); padding: 0 6px 2px; }
    .pfm-h-sub {
      font-size: clamp(15px, 4vw, 20px); color: #C1121F; line-height: 1.55;
      font-weight: 700; margin-bottom: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    }
    .pfm-h-sub .x {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 50%;
      background: #1F7A3A; color: #FFFFFF; flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(31,122,58,.25);
    }
    .pfm-h-sub .x svg { width: 14px; height: 14px; }

    /* ── Avatar pill (avatars only) ── */
    .pfm-h-avatars-pill {
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 10px;
      background: #FAFAF7; border: 1px solid #ECECE5;
      padding: 8px 16px; border-radius: 999px;
      width: fit-content;
    }
    .pfm-h-avatars { display: inline-flex; align-items: center; }
    .pfm-h-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid #FFFFFF; margin-left: -8px;
      object-fit: cover; display: inline-block;
      background: #EDF7EE; box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .pfm-h-avatar:first-child { margin-left: 0; }

    /* ── Stars + count — now a separate element ── */
    .pfm-h-rating {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; flex-wrap: wrap;
      margin: 0 auto 26px;
      font-size: 15px; font-weight: 600; color: #1A1A1A;
      letter-spacing: .1px;
    }
    .pfm-h-rating .stars { color: #F5A524; letter-spacing: 1px; font-size: 18px; }
    .pfm-h-rating b { color: #0F2A1A; font-weight: 700; }

    .pfm-h-cta {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 12px; padding: 18px 28px;
      font-size: 18px; font-weight: 700;
      background: linear-gradient(180deg, #FFD43B 0%, #FFC107 100%);
      color: #0F2A1A; border-radius: 16px;
      text-decoration: none; border: none; cursor: pointer; line-height: 1;
      font-family: inherit;
      box-shadow: 0 10px 24px -8px rgba(255,167,0,.55), 0 2px 6px rgba(15,42,26,.08);
      transition: all .2s ease;
      margin-bottom: 14px;
      width: 100%; max-width: 320px; position: relative;
    }
    .pfm-h-cta:hover { transform: translateY(-1px); box-shadow: 0 14px 30px -8px rgba(255,167,0,.65), 0 4px 10px rgba(15,42,26,.10); color: #0F2A1A; }
    .pfm-h-cta svg { flex-shrink: 0; }
    .pfm-h-cta .arr { display: inline-block; transition: transform .2s ease; }
    .pfm-h-cta:hover .arr { transform: translateX(4px); }
    .pfm-h-microcopy {
      font-size: 12.5px; color: #6a6a6a; font-weight: 500;
      margin-bottom: 28px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .pfm-h-microcopy .lock { color: #1F7A3A; }
    .pfm-h-trust { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 560px; margin: 0 auto 8px; }
    .pfm-h-trust-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; padding: 16px 10px;
      background: #F4F8F2; border: none; border-radius: 14px;
      text-align: center; box-shadow: 0 1px 2px rgba(15,42,26,.04);
    }
    .pfm-h-trust-item .ic {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 50%;
      background: #E4F0E2; color: #1F7A3A; font-size: 22px; flex-shrink: 0;
    }
    .pfm-h-trust-item .label { font-size: 13px; font-weight: 600; color: #1A1A1A; line-height: 1.35; }
    .pfm-h-leaf { position: absolute; pointer-events: none; opacity: .08; font-size: 180px; line-height: 1; }
    .pfm-h-leaf.l1 { top: 20px; left: -50px; transform: rotate(-25deg); }
    .pfm-h-leaf.l2 { bottom: -40px; right: -60px; transform: rotate(20deg); opacity: .06; }

    @media (max-width: 768px) {
      .pfm-h-wrap { padding: 36px 16px 0; }
      .pfm-h-strip { font-size: 11.5px; padding: 9px 14px; gap: 8px; margin-bottom: 8px; }
      .pfm-h-strip .sep { display: none; }
      .pfm-h-strip .txt { gap: 4px 10px; }
      .pfm-h-title { font-size: clamp(20px, 5.2vw, 28px); margin-bottom: 12px; line-height: 1.35; }
      .pfm-h-sub { font-size: clamp(13px, 3.6vw, 16px); margin-bottom: 10px; gap: 6px; }
      .pfm-h-sub .x { width: 20px; height: 20px; }
      .pfm-h-sub .x svg { width: 12px; height: 12px; }
      .pfm-h-avatars-pill { padding: 6px 12px; margin-bottom: 8px; }
      .pfm-h-avatar { width: 26px; height: 26px; margin-left: -8px; }
      .pfm-h-rating { font-size: 13px; gap: 6px; margin-bottom: 18px; }
      .pfm-h-rating .stars { font-size: 15px; }
      .pfm-h-cta { padding: 14px 20px; font-size: 15.5px; gap: 10px; border-radius: 14px; margin-bottom: 10px; max-width: 360px; }
      .pfm-h-microcopy { font-size: 11.5px; margin-bottom: 20px; text-align: center; padding: 0 8px; }
      .pfm-h-trust { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .pfm-h-trust-item { gap: 6px; padding: 12px 6px; }
      .pfm-h-trust-item .ic { width: 34px; height: 34px; }
      .pfm-h-trust-item .ic svg { width: 16px; height: 16px; }
      .pfm-h-trust-item .label { font-size: 11.5px; line-height: 1.3; }
      .pfm-h-leaf { font-size: 90px; opacity: .05; }
      .pfm-h-leaf.l1 { top: 10px; left: -30px; }
      .pfm-h-leaf.l2 { bottom: -20px; right: -30px; }
    }

    @media (max-width: 380px) {
      .pfm-h-wrap { padding: 28px 12px 0; }
      .pfm-h-title { font-size: clamp(19px, 5.4vw, 24px); }
      .pfm-h-avatars-pill { padding: 5px 10px; }
      .pfm-h-rating { font-size: 12px; }
      .pfm-h-rating .stars { font-size: 14px; }
      .pfm-h-trust { gap: 5px; }
      .pfm-h-trust-item { padding: 10px 4px; }
      .pfm-h-trust-item .ic { width: 30px; height: 30px; }
      .pfm-h-trust-item .ic svg { width: 14px; height: 14px; }
      .pfm-h-trust-item .label { font-size: 10.5px; }
    }
  </style>
