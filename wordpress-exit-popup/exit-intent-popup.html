<!-- ============================================================
     এক্সিট-ইনটেন্ট ডিসকাউন্ট পপআপ (Elementor HTML উইজেট)
     WooCommerce + CartFlows Pro — পেজে এমবেড করা অর্ডার ফর্মের জন্য
     ------------------------------------------------------------
     ইন্সটল: Elementor পেজের একদম নিচে একটি "HTML" উইজেট যোগ করে
     এই পুরো ফাইলের কোড পেস্ট করুন। কনফিগারেশন নিচের CONFIG
     অবজেক্টে পরিবর্তন করুন।

     সাথে woocommerce-coupon.php স্নিপেটটি অবশ্যই সক্রিয় থাকতে
     হবে — সেটিই AJAX-এর মাধ্যমে কুপন কার্টে অ্যাপ্লাই করে।
     ============================================================ -->

<style>
  #zl-exit-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.72);
    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;

  #zl-exit-overlay.zl-show { display: flex; }

  @keyframes zl-pop {

    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  .zl-exit-close {
    position: absolute;
    top: 10px;

    border: 0;

    font-size: 26px;

    cursor: pointer;
  }
  .zl-exit-badge {
    display: inline-block;
    background: #fef3c7;

    font-size: 14px;

    border-radius: 999px;
    margin-bottom: 14px;
  }
  .zl-exit-popup h2 {
    font-size: 24px;

    margin: 0 0 10px;
    font-weight: 700;

  .zl-exit-popup h2 .zl-exit-amount { color: #dc2626; }
  .zl-exit-popup p {
    font-size: 16px;

  .zl-exit-timer {
    background: #fee2e2;

  .zl-exit-btn:hover { background: #15803d; }

    cursor: pointer;
    font-family: inherit;
  }
  /* ডিসকাউন্ট নেওয়ার পর ফর্মের উপরে দেখানো সবুজ বার্তা */
  .zl-exit-applied-note {
    background: #dcfce7;
    color: #166534;
    font-weight: 700;
    border-radius: 10px;
    padding: 12px 16px;
    margin: 0 0 16px;
    text-align: center;
  }
  @media (max-width: 480px) {
    .zl-exit-popup { padding: 30px 20px 22px; }
    .zl-exit-popup h2 { font-size: 21px; }
  }
</style>

<div id="zl-exit-overlay" aria-hidden="true">
  <div class="zl-exit-popup" role="dialog" aria-modal="true" aria-labelledby="zl-exit-title">
    <button type="button" class="zl-exit-close" id="zl-exit-close" aria-label="বন্ধ করুন">&times;</button>

    </button>

<script>
(function () {
  'use strict';

  /* ============ কনফিগারেশন — শুধু এই অংশটুকু বদলান ============ */
  var CONFIG = {
    minSecondsOnPage: 45,      // কত সেকেন্ড পরে পপআপ সক্রিয় হবে
    discountAmount: 100,       // ডিসকাউন্ট (টাকা) — 50 বা 100
    couponCode: 'EXIT100',     // WooCommerce কুপন কোড (PHP স্নিপেটের সাথে মিলতে হবে)
    offerMinutes: 15,          // কাউন্টডাউন টাইমার (মিনিট)
    frequencyHours: 24,        // একই ভিজিটরকে কত ঘণ্টা পর আবার দেখানো হবে

    // mode: 'form'        → পেজেই থাকবে: AJAX দিয়ে কুপন অ্যাপ্লাই + ফর্মে স্ক্রল
    //                       (CartFlows / এমবেড করা WooCommerce চেকআউটের জন্য)
    // mode: 'woocommerce' → আলাদা চেকআউট পেজে রিডাইরেক্ট করবে
    mode: 'form',

    // AJAX এন্ডপয়েন্ট — সাধারণত বদলাতে হবে না
    ajaxUrl: '/wp-admin/admin-ajax.php',

    // অর্ডার ফর্মের সিলেক্টর: CartFlows/WooCommerce চেকআউট ফর্ম নিজে
    // থেকেই ধরা পড়বে; নিজের কোনো সেকশনে স্ক্রল করাতে চাইলে তার
    // CSS ID দিন (যেমন '#order-form')
    orderFormSelector: '#order-form, form.woocommerce-checkout, .cartflows-container',

    // পেজে আলাদা করে দাম দেখানোর এলিমেন্ট (ঐচ্ছিক):
    // যেমন <span data-zl-price="990">৳৯৯০</span> → ডিসকাউন্টের পর
    // স্বয়ংক্রিয়ভাবে কাটা দামসহ দেখাবে
    priceSelector: '[data-zl-price]',

    // woocommerce মোডে CTA-র গন্তব্য (form মোডে দরকার নেই)
    ctaUrl: '/checkout/?add-to-cart=123'
  };
  /* ============================================================= */

  var overlay = document.getElementById('zl-exit-overlay');
  if (!overlay) return;

  var LS_SHOWN = 'zl_exit_shown_at';
  var LS_DEADLINE = 'zl_exit_deadline';
  var shown = false;
  var claimed = false;
  var countdownTimer = null;

  // সংখ্যাকে বাংলা ডিজিটে রূপান্তর
  function bn(n) {
    return String(n).replace(/\d/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; });
  }

  /* ---------- GTM / GA4 dataLayer ইভেন্ট ---------- */
  function pushEvent(name, extra) {
    window.dataLayer = window.dataLayer || [];
    var data = {
      event: name,
      coupon_code: CONFIG.couponCode,
      discount_amount: CONFIG.discountAmount,
      currency: 'BDT'
    };
    if (extra) { for (var k in extra) { data[k] = extra[k]; } }
    window.dataLayer.push(data);
  }

  function setCookie(name, value, maxAgeSeconds) {
    document.cookie = name + '=' + encodeURIComponent(value) +
      '; path=/; max-age=' + maxAgeSeconds + '; SameSite=Lax';
  }

  function hasCookie(name) {
    return document.cookie.indexOf(name + '=') !== -1;
  }

  // ফ্রিকোয়েন্সি চেক: সম্প্রতি দেখানো হলে বা ডিসকাউন্ট নেওয়া থাকলে আর দেখাবে না
  function suppressed() {
    if (hasCookie('zl_exit_coupon')) return true;
    try {
      var at = parseInt(localStorage.getItem(LS_SHOWN) || '0', 10);
      return at && (Date.now() - at) < CONFIG.frequencyHours * 3600 * 1000;
    } catch (e) { return false; }
  }

  // ডিসকাউন্টের পরিমাণ পপআপে বসানো
  Array.prototype.forEach.call(
    overlay.querySelectorAll('.zl-exit-amount'),
    function (el) { el.textContent = '৳' + bn(CONFIG.discountAmount) + ' টাকা'; }
  );

  /* ---------- সময় গণনা: setInterval-এর টিকের বদলে টাইমস্ট্যাম্প ----------
     ট্যাব দৃশ্যমান থাকা সময় Date.now() দিয়ে জমা হয় — ব্রাউজার টাইমার
     থ্রটল করলেও বা কোনো "সেকেন্ড" মিস হলেও হিসাব নির্ভুল থাকে। */
  var visibleAccumMs = 0;
  var visibleSince = document.hidden ? null : Date.now();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (visibleSince) { visibleAccumMs += Date.now() - visibleSince; visibleSince = null; }
    } else if (!visibleSince) {
      visibleSince = Date.now();
    }
  });

  function visibleSeconds() {
    return (visibleAccumMs + (visibleSince ? Date.now() - visibleSince : 0)) / 1000;
  }

  function timeGatePassed() {
    return visibleSeconds() >= CONFIG.minSecondsOnPage;
  }

  // পপআপ দেখানো যাবে কি না — ঠিক দেখানোর মুহূর্তে যাচাই হয়
  function canShow() {
    return timeGatePassed() && !shown && !suppressed();
  }

  /* ---------- ট্রিগার ১: ডেস্কটপ — মাউস উপরের দিকে বেরিয়ে গেলে ---------- */
  document.addEventListener('mouseout', function (e) {
    if (canShow() && !e.relatedTarget && e.clientY <= 0) showPopup('mouse_exit');
  });

  /* ---------- ট্রিগার ২: মোবাইল — ব্যাক বাটন / ব্যাক জেসচার ----------
     Chrome/Android-এর "history manipulation intervention" নীতি:
     ইউজারের কোনো ইন্টারঅ্যাকশন ছাড়া pushState দিয়ে বানানো হিস্টরি
     এন্ট্রি ব্যাক-বাটনে এড়িয়ে যাওয়া হয় (popstate ফায়ারই হয় না)।
     তাই সেন্টিনেল এন্ট্রিটি পুশ করা হয় ভিজিটরের *প্রথম ইন্টারঅ্যাকশনে*
     (টাচ/ক্লিক/কী/স্ক্রল) — ৪৫ সেকেন্ডের জন্য অপেক্ষা করা হয় না।
     ৪৫ সেকেন্ডের গেটটি popstate-এর ভেতরে যাচাই হয়; গেট পার না হলে
     history.back() দিয়ে ভিজিটরকে স্বাভাবিকভাবে বেরিয়ে যেতে দেওয়া হয়। */
  var sentinelActive = false;

  function armBackTrap() {
    if (sentinelActive || shown || suppressed()) return;
    try {
      history.pushState({ zlExit: true }, '');
      sentinelActive = true;
    } catch (e) { /* pushState ব্লকড — ব্যাক-ট্র্যাপ ছাড়া বাকি সব চলবে */ }
  }

  window.addEventListener('popstate', function () {
    if (!sentinelActive) return; // অন্য কোনো নেভিগেশন (হ্যাশ লিংক ইত্যাদি)
    sentinelActive = false;      // সেন্টিনেল এন্ট্রিটি এইমাত্র পপ হলো
    if (canShow()) {
      showPopup('back_button');
    } else {
      // ৪৫ সেকেন্ড পার হয়নি বা পপআপ আগেই দেখানো হয়েছে —
      // ভিজিটরকে আটকানো হবে না, ব্যাক নেভিগেশন চলতে থাকবে
      history.back();
    }
  });

  // প্রথম ইন্টারঅ্যাকশনে ট্র্যাপ আর্ম — Chrome-এর user-activation শর্ত পূরণ হয়
  ['touchstart', 'pointerdown', 'mousedown', 'keydown', 'scroll'].forEach(function (evt) {
    window.addEventListener(evt, armBackTrap, { once: true, passive: true, capture: true });
  });

  /* ---------- ট্রিগার ৩: মোবাইল — দ্রুত উপরের দিকে স্ক্রল ---------- */
  var lastY = 0, lastT = 0;
  window.addEventListener('scroll', function () {
    var y = window.pageYOffset, t = Date.now();
    // পেজের কিছুটা নিচে নেমে দ্রুত (৪০০px/৩০০ms) উপরে উঠলে
    if (canShow() && lastY - y > 400 && t - lastT < 300 && y > 300) showPopup('fast_scroll_up');
    lastY = y; lastT = t;
  }, { passive: true });

  /* ---------- পপআপ দেখানো ---------- */
  function showPopup(trigger) {
    shown = true;
    try { localStorage.setItem(LS_SHOWN, String(Date.now())); } catch (e) {}
    overlay.classList.add('zl-show');
    overlay.setAttribute('aria-hidden', 'false');
    document.getElementById('zl-exit-cta').focus();
    startCountdown();
    pushEvent('exit_popup_shown', { popup_trigger: trigger });
  }

  function hidePopup(dismissMethod) {
    overlay.classList.remove('zl-show');
    overlay.setAttribute('aria-hidden', 'true');
    if (countdownTimer) clearInterval(countdownTimer);
    // ডিসকাউন্ট না নিয়ে বন্ধ করলে dismissed ইভেন্ট
    if (dismissMethod && !claimed) {
      pushEvent('exit_popup_dismissed', { dismiss_method: dismissMethod });
    }
  }

  /* ---------- কাউন্টডাউন (রিফ্রেশ করলেও রিসেট হয় না) ---------- */
  function startCountdown() {
    var deadline;
    try {
      deadline = parseInt(localStorage.getItem(LS_DEADLINE) || '0', 10);
      if (!deadline || deadline < Date.now()) {
        deadline = Date.now() + CONFIG.offerMinutes * 60 * 1000;
        localStorage.setItem(LS_DEADLINE, String(deadline));
      }
    } catch (e) {
      deadline = Date.now() + CONFIG.offerMinutes * 60 * 1000;
    }
    var el = document.getElementById('zl-exit-countdown');
    function tick() {
      var left = Math.max(0, Math.floor((deadline - Date.now()) / 1000));
      var m = Math.floor(left / 60), s = left % 60;
      el.textContent = bn((m < 10 ? '0' : '') + m) + ':' + bn((s < 10 ? '0' : '') + s);
      if (left <= 0) { clearInterval(countdownTimer); hidePopup('expired'); }
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  /* ---------- AJAX: কুপন কার্টে অ্যাপ্লাই (form মোড) ---------- */
  function applyCouponViaAjax() {
    var body = 'action=zl_apply_exit_coupon&coupon=' + encodeURIComponent(CONFIG.couponCode);
    fetch(CONFIG.ajaxUrl, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var status = (res && res.data && res.data.status) || (res && res.success ? 'applied' : 'failed');
        pushEvent('exit_popup_coupon_applied', { apply_status: status });
        // CartFlows / WooCommerce চেকআউটের টোটাল রিফ্রেশ — ডিসকাউন্ট
        // কাটা দাম অর্ডার সামারিতে সাথে সাথে দেখা যাবে
        if (window.jQuery) {
          window.jQuery(document.body).trigger('update_checkout');
        }
      })
      .catch(function () {
        // AJAX ব্যর্থ হলেও কুকি সেট আছে — পরের পেজলোডে PHP স্নিপেট
        // কুপনটি অ্যাপ্লাই করে দেবে
        pushEvent('exit_popup_coupon_applied', { apply_status: 'ajax_error' });
      });
  }

  /* ---------- ডিসকাউন্ট নেওয়ার পর পেজের দাম ও বার্তা আপডেট ---------- */
  function updatePageAfterClaim() {
    // data-zl-price দেওয়া এলিমেন্টে কাটা দাম দেখানো
    Array.prototype.forEach.call(document.querySelectorAll(CONFIG.priceSelector), function (el) {
      var base = parseFloat(el.getAttribute('data-zl-price'));
      if (!isNaN(base)) {
        var now = Math.max(0, base - CONFIG.discountAmount);
        el.innerHTML = '<del style="color:#94a3b8">৳' + bn(base) + '</del> <strong>৳' + bn(now) + '</strong>';
      }
    });
    // অর্ডার ফর্মের উপরে সবুজ নিশ্চিতকরণ বার্তা
    var form = document.querySelector(CONFIG.orderFormSelector);
    if (form && !document.getElementById('zl-exit-applied-note')) {
      var note = document.createElement('div');
      note.id = 'zl-exit-applied-note';
      note.className = 'zl-exit-applied-note';
      note.textContent = '🎉 অভিনন্দন! আপনার ৳' + bn(CONFIG.discountAmount) +
        ' টাকা ডিসকাউন্ট যোগ হয়েছে — নিচের ফর্মটি পূরণ করে অর্ডার সম্পন্ন করুন।';
      form.parentNode.insertBefore(note, form);
    }
    if (form) form.scrollIntoView({ behavior: 'smooth' });
  }

  /* ---------- CTA: ডিসকাউন্ট নিয়ে অর্ডার ---------- */
  document.getElementById('zl-exit-cta').addEventListener('click', function () {
    claimed = true;
    // কুকি সেট — AJAX ব্যর্থ হলে বা পেজ রিলোড হলে PHP স্নিপেট এটি
    // দেখে কুপন অ্যাপ্লাই করবে (ফলব্যাক)
    setCookie('zl_exit_coupon', CONFIG.couponCode, CONFIG.offerMinutes * 60);
    pushEvent('exit_popup_claimed');

    if (CONFIG.mode === 'woocommerce') {
      var sep = CONFIG.ctaUrl.indexOf('?') === -1 ? '?' : '&';
      window.location.href = CONFIG.ctaUrl + sep + 'exit_coupon=' + encodeURIComponent(CONFIG.couponCode);
      return;
    }

    // form মোড: পেজেই থেকে কুপন অ্যাপ্লাই + দাম আপডেট + ফর্মে স্ক্রল
    hidePopup();
    applyCouponViaAjax();
    updatePageAfterClaim();
  });

  /* ---------- বন্ধ করার উপায়সমূহ ---------- */
  document.getElementById('zl-exit-close').addEventListener('click', function () { hidePopup('close_button'); });
  document.getElementById('zl-exit-no').addEventListener('click', function () { hidePopup('no_thanks'); });
  overlay.addEventListener('click', function (e) { if (e.target === overlay) hidePopup('overlay_click'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('zl-show')) hidePopup('escape_key');
  });
})();
</script>
